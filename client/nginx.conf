server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The Ingress terminates TLS and routes /api and /socket.io
    # to the API service, so this tier only ever serves static files.

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Probe target must not be the SPA fallback,
    # or a broken build could still return 200.
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames,
    # so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached,
    # otherwise clients may keep loading an old bundle
    # that references assets which no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing:
    # unknown paths render the SPA rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}