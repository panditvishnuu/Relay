server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # When the client is reached directly instead of through Ingress, keep API
    # and websocket traffic on the same origin by proxying to the backend
    # service over the cluster DNS name.
    location /api {
        proxy_pass http://relay-server-service.relay.svc.cluster.local:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://relay-server-service.relay.svc.cluster.local:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Probe target must not be the SPA fallback,
    # or a broken build could still return 200.
    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Vite emits content-hashed filenames,
    # so these can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached,
    # otherwise clients may keep loading an old bundle
    # that references assets which no longer exist after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing:
    # Send the app root to the login screen.
    location = / {
        return 302 /login;
    }

    # Client-side routing:
    # unknown paths render the SPA rather than returning 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
